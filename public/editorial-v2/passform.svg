<path d="M-76 22Q-53 63 -32 74" stroke="#fffdf2" stroke-width="7" fill="none" stroke-linecap="round"/>
</g>
<!-- Medium cone, nearer overhead and organically round. -->
<g transform="translate(579 382) rotate(8)">
<ellipse cx="6" cy="127" rx="119" ry="26" fill="#325e4a" opacity=".14" filter="url(#shadow)"/>
<path d="M-111 8Q-67 84 -31 105L-27 163Q0 179 27 163L31 105Q72 79 111 8Z" fill="url(#cream)" stroke="#b5c8b4" stroke-width="2"/>
