<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
 <linearGradient id="cream" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffef9"/><stop offset=".52" stop-color="#f4f0e5"/><stop offset="1" stop-color="#d7d9ca"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#45978a"/><stop offset=".48" stop-color="#086d61"/><stop offset="1" stop-color="#064b43"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f0f8ec"/><stop offset=".55" stop-color="#dceee5"/><stop offset="1" stop-color="#a5c7b9"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f5bf9e"/><stop offset=".55" stop-color="#ed977f"/><stop offset="1" stop-color="#cf7d69"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#fffef5" stop-opacity=".96"/><stop offset=".3" stop-color="#edf4eb" stop-opacity=".7"/><stop offset=".8" stop-color="#c8ddd1" stop-opacity=".88"/><stop offset="1" stop-color="#a4beb0" stop-opacity=".9"/></linearGradient>
 <radialGradient id="light" cx=".23" cy=".1" r=".95"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#f4e9d7"/></radialGradient>
 <radialGradient id="bowl"><stop stop-color="#718e7f"/><stop offset=".8" stop-color="#a8bcae"/><stop offset="1" stop-color="#d6ddd0"/></radialGradient>
 <radialGradient id="cup"><stop stop-color="#fffef8"/><stop offset=".55" stop-color="#f1f0e6"/><stop offset=".84" stop-color="#d2ded3"/><stop offset="1" stop-color="#a8c4b5"/></radialGradient>
 <filter id="shadow" x="-40%" y="-50%" width="180%" height="210%"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
 </defs>
<g filter="url(#paper)">
<rect width="1200" height="900" fill="url(#light)"/>
<path d="M0 0H1200V150Q599 245 0 143Z" fill="#dceee5" opacity=".65"/>
<path d="M0 690Q435 630 1200 786V900H0Z" fill="#ebddc7"/>
