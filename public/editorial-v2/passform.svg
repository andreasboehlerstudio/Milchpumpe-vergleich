<path d="M-66 75Q-49 95 -33 102" fill="none" stroke="#fffdf4" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- Larger cone, different axis and wider aperture. -->
<g transform="translate(858 463) rotate(21)">
<ellipse cx="6" cy="130" rx="129" ry="30" fill="#325e4a" opacity=".14" filter="url(#shadow)"/>
<path d="M-124 -8Q-74 80 -37 110L-31 164Q0 184 31 164L37 110Q74 80 124 -8Z" fill="url(#cream)" stroke="#adc3ae" stroke-width="2"/>
<ellipse cy="-5" rx="132" ry="85" fill="url(#mint)" stroke="#99b89f" stroke-width="3"/>
<ellipse cy="-5" rx="113" ry="70" fill="url(#cream)"/>
<ellipse cy="-1" rx="37" ry="32" fill="#abc3b2"/>
<ellipse cy="1" rx="26" ry="24" fill="#769b86"/>
<path d="M-95 -33Q-57 -63 17 -58" fill="none" stroke="#fffdf4" stroke-width="9" stroke-linecap="round"/>
</g>
<!-- Loose measuring ribbon with ticks only, no numeric claims. -->
<ellipse cx="579" cy="747" rx="290" ry="24" fill="#325e4a" opacity=".10" filter="url(#shadow)"/>
<path d="M285 709Q426 641 583 708Q742 774 944 681L953 723Q745 818 571 751Q434 690 304 751Z" fill="url(#coral)"/>
