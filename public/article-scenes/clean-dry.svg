<title id="clean-dry-title">Einzelteile auf einem Abtropfgestell, Motor separat und ausgesteckt</title>
<desc id="clean-dry-description">Originale schematische Illustration: getrennte Flasche, Brusthaube, Ventil und Membran auf einem sauberen Gestell. Der Motor liegt daneben; sein Stecker ist sichtbar nicht angeschlossen. Keine Anleitung für ein bestimmtes Modell.</desc>
