<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="parts-identity-title parts-identity-description">
<title id="parts-identity-title">Unterschiedliche Ventil- und Membranformen mit Anleitung und leerem Modellanhänger</title>
<desc id="parts-identity-description">Ein längliches Lippenventil und eine runde Membran sind klar getrennt dargestellt. Daneben liegen eine abstrakte aufgeschlagene Anleitung und ein unbeschrifteter Modellanhänger. Keine Aussage zur Kompatibilität bestimmter Ersatzteile.</desc>
