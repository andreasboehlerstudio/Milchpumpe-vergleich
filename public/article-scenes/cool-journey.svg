<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="cool-journey-title cool-journey-description">
<title id="cool-journey-title">Geöffnete Kühltasche mit verschlossenen Flaschen und Kühlakkus</title>
<desc id="cool-journey-description">Eine abstrakte isolierte Tragetasche mit offenem Deckel enthält zwei geschlossene Flaschen und zwei Kühlakkus. Keine Marke, keine zugesicherte Kühldauer und keine Temperaturangaben.</desc>
