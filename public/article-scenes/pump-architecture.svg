<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="pump-architecture-title pump-architecture-description">
<title id="pump-architecture-title">Schematischer Vergleich: integrierter Motor und separat verbundener Motor</title>
<desc id="pump-architecture-description">Links sitzt ein abstrakter Motor direkt auf einer Auffangschale. Rechts führt ein sichtbarer Schlauch von einer zweiten Schale zu einem separaten Motor. Die Formen stellen kein konkretes Produkt dar.</desc>
