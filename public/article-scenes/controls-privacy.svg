<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="controls-privacy-title controls-privacy-description">
<title id="controls-privacy-title">Abstraktes Pumpenbedienfeld neben Smartphone mit Datenschutzschild</title>
<desc id="controls-privacy-description">Ein generisches Bediengerät mit einfachen Tasten steht neben einem Smartphone. Ein Schild mit Schloss überdeckt dessen ansonsten leere Fläche. Keine App-Oberfläche, keine Marke und keine Leistungs- oder Datenschutzgarantie.</desc>
