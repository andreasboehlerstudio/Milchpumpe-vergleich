<title id="milk-portions-title">Verschlossene Milchbeutel und Flaschen mit unbeschrifteten Etiketten</title>
<desc id="milk-portions-description">Zwei geschlossene Milchbeutel und zwei geschlossene Flaschen stehen auf einer hellen Arbeitsfläche. Daneben liegen leere Etiketten. Die Illustration enthält keine Mengen-, Temperatur- oder Zeitangaben.</desc>
