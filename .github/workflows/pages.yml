name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify README changelog update
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Fxq "README.md"; then
            echo "README.md muss bei jedem Push auf main einen neuen Changelog-Eintrag enthalten."
            exit 1
          fi

          if ! grep -Fq "## Changelog" README.md; then
            echo "Der Abschnitt '## Changelog' fehlt in README.md."
            exit 1
          fi

          git show "${{ github.event.before }}:README.md" | sed -n '/^## Changelog/,$p' > /tmp/changelog-before.txt
          sed -n '/^## Changelog/,$p' README.md > /tmp/changelog-current.txt

          if cmp -s /tmp/changelog-before.txt /tmp/changelog-current.txt; then
            echo "Der Changelog-Abschnitt in README.md wurde nicht aktualisiert."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and verify production HTML
        run: npm run lint && npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
